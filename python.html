<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- Tema Prism.js untuk mewarnai kode -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
</head>
<body class="bg-blue-50/30 dark:bg-slate-900 transition-colors duration-300 p-4 md:p-8 min-h-screen font-sans">
    
    <button id="btn-theme" class="absolute top-6 right-6 p-3 bg-white dark:bg-slate-800 rounded-full shadow-md text-xl">🌓</button>

    <main class="max-w-4xl mx-auto">
        <a href="index.html" class="inline-block mb-6 text-blue-600 dark:text-blue-400 font-bold hover:text-blue-800">← Kembali</a>
        
        <header class="mb-8">
            <h1 class="text-3xl font-extrabold text-blue-900 dark:text-white mb-2">🐍 Ruang Belajar Python</h1>
        </header>

        <!-- Form Input dengan Input Kode Khusus -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-blue-100 dark:border-slate-700 mb-8">
            <div class="flex flex-col gap-4">
                <input type="text" id="input-title" placeholder="Topik Python..." class="p-3 border rounded-xl dark:bg-slate-700 dark:text-white outline-none">
                <input type="text" id="input-note" placeholder="Penjelasan / Konsep..." class="p-3 border rounded-xl dark:bg-slate-700 dark:text-white outline-none">
                <!-- Textarea untuk menaruh kode asli -->
                <textarea id="input-code" placeholder="Tempel kodingan Python di sini..." class="p-3 border rounded-xl font-mono text-sm h-32 dark:bg-slate-700 dark:text-white outline-none"></textarea>
                <button id="btn-submit-python" class="py-3 px-6 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700">Simpan Logika</button>
            </div>
        </div>

        <div id="python-container" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </main>

    <!-- Script Prism.js untuk memproses sintaks Python -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
